<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TradingView Image Viewer</title>
  
  <!-- Safari PWA & iOS Home Screen Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TV Viewer">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#131722">
  <meta name="description" content="TradingView-styled PWA Image Viewer with Pan, Zoom, Lock X, and Lock Y features.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-192.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Top Toolbar -->
    <header class="tv-toolbar" id="toolbar">
      <div class="toolbar-left">
        <label for="fileInput" class="tv-btn primary-btn" title="Upload Image (O)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Upload</span>
        </label>
        <input type="file" id="fileInput" accept="image/*" class="sr-only">
      </div>
    </header>

    <!-- Canvas Container -->
    <main class="canvas-viewport" id="viewport">
      <canvas id="imageCanvas"></canvas>
      
      <!-- Drag & Drop Overlay -->
      <div id="dropZone" class="drop-zone hidden">
        <div class="drop-content">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#2962ff" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="drop-text">Drop chart or image here</p>
        </div>
      </div>

      <!-- Quick Floating Control Bar (Mobile friendly) -->
      <!-- <div class="floating-controls" id="floatingControls">
        <button id="floatZoomIn" class="float-btn" title="Zoom In">+</button>
        <button id="floatZoomOut" class="float-btn" title="Zoom Out">&minus;</button>
      </div> -->
    </main>
  </div>

  <!-- JS Engine & App Logic -->
  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/gestures.js"></script>
  <script src="js/imageLoader.js"></script>
  <script src="js/toolbar.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('ServiceWorker registered with scope:', registration.scope);
          })
          .catch(error => {
            console.error('ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
